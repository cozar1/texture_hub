<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <title>{% block title %}Texture Hub{% endblock %}</title>
</head>

<body class="th-body">
    {% if request.endpoint not in ('login', 'signup') %}
    <header class="th-navbar">
        <a href="/" class="th-brand">TEXTURE HUB</a>

        <div class="container">
            <ul class="th-nav-links">
                <li><a href="/0" class="th-nav-link {% if request.path == '/' %}is-active{% endif %}">TEXTURES</a></li>
                <li><a href="/1"
                        class="th-nav-link {% if request.path == '/collections' %}is-active{% endif %}">COLLECTIONS</a>
                </li>
            </ul>
        </div>

        <div class="container">
            <ul class="th-nav-links">
                {% if user %}
                <li><a class="th-nav-link" href="/user/{{ user.user_name }}">{{ user.user_name }}</a></li>
                {% else %}
                <li><a href="/login" class="th-nav-link {% if request.path == '/' %}is-active{% endif %}">Login</a></li>
                {% endif %}
            </ul>
        </div>
    </header>
    {% endif %}
    <main class="th-page">
        {% block content %}
        {% endblock %}
    </main>
</body>

</html>
