{% extends "template.html" %}
{% block content %}
{% if error%}
    <div class="error">
        <p>{{error}}</p>
    </div>
{% endif%}
<div class="th-login-wrap">
    <div class="th-login-card">
        <h1 class="th-login-title">Login</h1>
        <div class="th-login-box">
    <form action="/login" method="post">
        <label class="th-label" for="username">Username</label>
        <input class="th-input" type="text" id="username" name="username">
        <label class="th-label" for="password">Password</label>
        <input class="th-input" type="password" id="password" name="password">
        <button class="th-btn th-btn-block" type="submit">Login</button>
    </form>
    
        </div>
    <p class="th-signup-row">No account? <a class="th-signup-link" href="/signup">Sign up</a></p>
    </div>
</div>

{% endblock %}
